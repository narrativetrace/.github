name: i18n check

# Verifies that every translated Markdown file exists, mirrors the structure of
# its English source, respects the glossary, and is not stale. Never generates
# or modifies text. Other narrativetrace repositories can reuse this workflow:
#
#   jobs:
#     i18n:
#       uses: narrativetrace/.github/.github/workflows/i18n-check.yml@main

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      config:
        description: Path to the i18n config file in the calling repository
        type: string
        default: i18n/config.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch i18n tooling
        if: github.repository != 'narrativetrace/.github'
        uses: actions/checkout@v4
        with:
          repository: narrativetrace/.github
          path: .i18n-tooling
          sparse-checkout: i18n

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check translations
        env:
          CONFIG: ${{ inputs.config || 'i18n/config.json' }}
        run: |
          if [ -d .i18n-tooling ]; then TOOL=.i18n-tooling/i18n/check.py; else TOOL=i18n/check.py; fi
          python "$TOOL" --config "$CONFIG"
